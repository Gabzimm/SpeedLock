<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpeedLock — Ecrãs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg-app:#0B0710;
  --surface-1:#17111F;
  --surface-2:#201A2B;
  --line:rgba(255,255,255,.09);
  --line-accent:rgba(139,92,246,.4);
  --lime:#8B5CF6;
  --lime-ink:#FFFFFF;
  --text-1:#F4F2F7;
  --text-2:#9C93AC;
  --danger:#FF6B5B;
  --page-bg:#EEEAF4;
  --ink:#171B16;
  --ink-muted:#6C7368;
  --chip-bg:#FFFFFF;
  --chip-line:#DCD3EA;
  --font-display:'Space Grotesk',sans-serif;
  --font-body:'Manrope',sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--page-bg);font-family:var(--font-body);color:var(--ink);min-height:100vh;display:flex;justify-content:center;padding:40px 20px 64px;}
.page{width:100%;max-width:640px;display:flex;flex-direction:column;align-items:center;gap:22px;}
.page-head{width:100%;}
.brand{display:flex;align-items:center;gap:12px;}
.brand-badge{width:40px;height:40px;border-radius:12px;background:var(--bg-app);display:flex;align-items:center;justify-content:center;color:var(--lime);flex-shrink:0;}
.brand-name{font-family:var(--font-display);font-weight:600;font-size:19px;color:var(--ink);}
.brand-sub{font-size:13px;color:var(--ink-muted);margin-top:1px;}
.tabs{display:flex;flex-wrap:wrap;gap:8px;width:100%;justify-content:center;}
.tab{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:999px;border:1px solid var(--chip-line);background:var(--chip-bg);color:var(--ink-muted);font-family:var(--font-body);font-weight:600;font-size:13px;cursor:pointer;transition:background .15s,color .15s,border-color .15s;}
.tab:hover{border-color:#B9C2AC;}
.tab.active{background:var(--ink);color:var(--lime);border-color:var(--ink);}
.tab svg{width:15px;height:15px;}
.stage-label{font-size:12.5px;color:var(--ink-muted);font-weight:600;}
.stage{display:flex;justify-content:center;width:100%;}
.phone{width:320px;height:668px;background:#050705;border-radius:46px;padding:10px;position:relative;border:1px solid rgba(139,92,246,.55);box-shadow:0 0 0 1px rgba(139,92,246,.12),0 0 46px -6px rgba(139,92,246,.45),0 30px 60px -24px rgba(10,5,15,.5);}
.dynamic-island{position:absolute;top:22px;left:50%;transform:translateX(-50%);width:90px;height:24px;background:#050705;border-radius:14px;z-index:5;}
.screen{position:relative;width:100%;height:100%;background:var(--bg-app);border-radius:36px;overflow:hidden;display:flex;flex-direction:column;color:var(--text-1);font-family:var(--font-body);}
.home-bar{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:120px;height:4px;border-radius:3px;background:rgba(255,255,255,.35);z-index:5;}
.status-row{display:flex;justify-content:space-between;align-items:center;padding:16px 22px 2px;font-family:var(--font-display);font-size:13px;font-weight:600;flex-shrink:0;}
.status-row .status-icons{display:flex;align-items:center;gap:4px;font-size:11px;}
.scr-body{flex:1;display:flex;flex-direction:column;padding:10px 22px 22px;overflow-y:auto;scrollbar-width:none;}
.scr-body::-webkit-scrollbar{display:none;}
.stack{display:flex;flex-direction:column;}
.gap-2{gap:2px;}.gap-4{gap:4px;}.gap-6{gap:6px;}.gap-8{gap:8px;}.gap-10{gap:10px;}.gap-12{gap:12px;}.gap-14{gap:14px;}.gap-16{gap:16px;}.gap-18{gap:18px;}.gap-20{gap:20px;}.gap-24{gap:24px;}
.row{display:flex;align-items:center;}
.row-between{display:flex;align-items:center;justify-content:space-between;}
.grow{flex:1;}
h1.scr-title{font-family:var(--font-display);font-weight:600;font-size:21px;margin:0;color:var(--text-1);}
h2.scr-title{font-family:var(--font-display);font-weight:600;font-size:19px;margin:0;color:var(--text-1);}
.muted{color:var(--text-2);font-size:13.5px;line-height:1.55;margin:0;}
.tiny-muted{color:var(--text-2);font-size:12px;}
.field{display:flex;flex-direction:column;gap:6px;}
.field label{font-size:12.5px;color:var(--text-2);font-weight:600;}
.input-wrap{position:relative;display:flex;align-items:center;}
input.field-input{width:100%;background:var(--surface-2);border:1px solid var(--line-accent);border-radius:12px;padding:13px 14px;color:var(--text-1);font-family:var(--font-body);font-size:14.5px;outline:none;}
input.field-input:focus{border-color:var(--lime);}
.input-icon-btn{position:absolute;right:8px;background:none;border:none;color:var(--text-2);cursor:pointer;padding:6px;}
.btn{font-family:var(--font-body);font-weight:600;font-size:14.5px;border-radius:14px;padding:14px;text-align:center;cursor:pointer;border:1px solid transparent;width:100%;}
.btn-primary{background:linear-gradient(90deg,#A855F7,#6D28D9);color:#fff;}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--text-1);}
.btn-text{background:none;border:none;color:var(--text-2);font-size:13.5px;text-align:center;cursor:pointer;font-family:var(--font-body);font-weight:600;width:100%;padding:4px;}
.btn-text.accent{color:var(--lime);}
.dots{display:flex;gap:6px;justify-content:center;}
.dot{width:6px;height:6px;border-radius:50%;background:var(--line);}
.dot.on{background:var(--lime);}
.code-row{display:flex;gap:6px;width:100%;}
.code-box{flex:1;min-width:0;max-width:42px;height:46px;background:var(--surface-2);border:1px solid var(--line-accent);border-radius:10px;text-align:center;font-family:var(--font-display);font-size:17px;color:var(--text-1);}
.code-box:focus{border-color:var(--lime);outline:none;}
.icon-circle{width:56px;height:56px;border-radius:50%;background:var(--surface-1);display:flex;align-items:center;justify-content:center;color:var(--lime);flex-shrink:0;}
.avatar{border-radius:50%;background:var(--surface-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--text-2);flex-shrink:0;}
.card{background:var(--surface-1);border:1px solid var(--line-accent);border-radius:16px;padding:14px 16px;}
.list-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);}
.list-item:last-child{border-bottom:none;}
.li-icon{width:34px;height:34px;border-radius:10px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--lime);flex-shrink:0;}
.li-text{flex:1;min-width:0;}
.li-title{font-size:14px;font-weight:600;color:var(--text-1);}
.li-sub{font-size:12px;color:var(--text-2);margin-top:1px;}
.chevron{color:var(--text-2);flex-shrink:0;display:flex;}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:4px 9px;border-radius:999px;white-space:nowrap;}
.badge-on{background:rgba(139,92,246,.14);color:var(--lime);}
.badge-off{background:var(--surface-2);color:var(--text-2);}
.switch{position:relative;display:inline-block;width:42px;height:25px;flex-shrink:0;cursor:pointer;}
.switch input{opacity:0;width:0;height:0;position:absolute;}
.switch-track{position:absolute;inset:0;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;transition:.15s;}
.switch-track::before{content:"";position:absolute;width:19px;height:19px;left:2px;top:1px;background:var(--text-2);border-radius:50%;transition:.15s;}
.switch input:checked + .switch-track{background:rgba(139,92,246,.2);border-color:var(--lime);}
.switch input:checked + .switch-track::before{transform:translateX(17px);background:var(--lime);}
.methods{display:flex;flex-direction:column;gap:9px;}
.method{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:14px;background:var(--surface-1);border:1px solid var(--line-accent);}
.method .m-icon{width:30px;height:30px;border-radius:9px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--text-2);flex-shrink:0;}
.method.active .m-icon{background:rgba(139,92,246,.16);color:var(--lime);}
.method .m-name{flex:1;font-size:13.5px;font-weight:600;}
.method .m-status{font-size:11.5px;color:var(--text-2);}
.method.active .m-status{color:var(--lime);}
.radar-wrap{position:relative;width:172px;height:172px;margin:4px auto 0;display:flex;align-items:center;justify-content:center;}
.radar-ring{position:absolute;border-radius:50%;border:1.5px solid var(--lime);opacity:0;animation:radar 2.4s ease-out infinite;}
.radar-ring:nth-child(2){animation-delay:.8s;}
.radar-ring:nth-child(3){animation-delay:1.6s;}
@keyframes radar{0%{width:66px;height:66px;opacity:.7;}100%{width:172px;height:172px;opacity:0;}}
.radar-center{position:relative;width:66px;height:66px;border-radius:50%;background:var(--surface-1);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--lime);z-index:2;}
.segmented{display:flex;background:var(--surface-1);border:1px solid var(--line);border-radius:12px;padding:3px;}
.segmented button{flex:1;background:none;border:none;color:var(--text-2);font-family:var(--font-body);font-weight:600;font-size:13px;padding:9px 0;border-radius:9px;cursor:pointer;}
.segmented button.active{background:var(--lime);color:var(--lime-ink);}
.gauge-wrap{position:relative;width:206px;height:206px;margin:2px auto 4px;}
.gauge-wrap svg{display:block;width:100%;height:100%;}
.gauge-center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;}
.gauge-num{font-family:var(--font-display);font-weight:700;font-size:44px;line-height:1;color:var(--text-1);}
.gauge-unit{font-size:12px;color:var(--text-2);font-weight:600;}
.gauge-state{font-size:11.5px;color:var(--lime);font-weight:600;margin-top:5px;}
.actions-row{display:flex;gap:9px;}
.action-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:14px;background:var(--surface-1);border:1px solid var(--line);color:var(--text-1);cursor:pointer;user-select:none;}
.action-btn.on{background:rgba(139,92,246,.14);border-color:var(--lime);color:var(--lime);}
.action-btn span{font-size:11px;font-weight:600;}
.action-btn.pulse{animation:pulse-once .4s ease;}
@keyframes pulse-once{0%{transform:scale(1);}40%{transform:scale(1.08);}100%{transform:scale(1);}}
.range-lime{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:2px;background:var(--surface-2);outline:none;}
.range-lime::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--surface-2);}
.range-lime::-webkit-slider-thumb{-webkit-appearance:none;margin-top:-7px;width:18px;height:18px;border-radius:50%;background:var(--lime);border:3px solid var(--bg-app);cursor:pointer;}
.range-lime::-moz-range-track{height:4px;border-radius:2px;background:var(--surface-2);}
.range-lime::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--lime);border:3px solid var(--bg-app);cursor:pointer;}
.metric{background:var(--surface-1);border-radius:14px;padding:14px;flex:1;}
.metric-num{font-family:var(--font-display);font-weight:700;font-size:19px;color:var(--text-1);}
.metric-label{font-size:11px;color:var(--text-2);margin-top:3px;}
.section-label{font-size:12px;font-weight:700;color:var(--text-2);margin:2px 2px 0;}
.icon{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block;}
@media (max-width:380px){
  .phone{width:272px;height:568px;border-radius:38px;padding:8px;}
  .screen{border-radius:30px;}
  .dynamic-island{width:76px;top:16px;}
}
.splash-logo{width:220px;height:auto;animation:splashIn .9s cubic-bezier(.16,1,.3,1);}
.form-logo{width:148px;height:auto;display:block;margin:2px auto 0;}
.input-icon-left{position:absolute;left:14px;color:var(--lime);display:flex;pointer-events:none;}
input.field-input.with-icon{padding-left:42px;}
.checkbox-row{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--text-2);cursor:pointer;}
.checkbox-row input{width:15px;height:15px;accent-color:var(--lime);}
.choice-btn{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--line-accent);background:var(--surface-1);color:var(--text-1);font-family:var(--font-body);font-weight:600;font-size:13.5px;cursor:pointer;text-align:left;}
.choice-btn .ci-icon{width:32px;height:32px;border-radius:9px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;color:var(--lime);flex-shrink:0;}
.choice-btn .ci-label{flex:1;}
.choice-btn .ci-chevron{color:var(--text-2);flex-shrink:0;}
.welcome-hero{position:relative;width:176px;height:176px;margin:2px auto 2px;display:flex;align-items:center;justify-content:center;}
.hero-ring{position:absolute;border-radius:50%;border:1px solid rgba(139,92,246,.3);}
.hero-ring.r1{width:176px;height:176px;}
.hero-ring.r2{width:130px;height:130px;border-color:rgba(139,92,246,.5);}
.hero-platform{position:relative;width:88px;height:88px;border-radius:50%;background:radial-gradient(circle at 50% 38%,rgba(139,92,246,.6),rgba(139,92,246,.06) 70%);display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 0 40px -6px rgba(139,92,246,.65);animation:heroFloat 3s ease-in-out infinite;}
@keyframes heroFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}

@keyframes splashIn{0%{opacity:0;transform:scale(.82);}100%{opacity:1;transform:scale(1);}}
.load-dots{display:flex;gap:6px;justify-content:center;}
.load-dots span{width:6px;height:6px;border-radius:50%;background:var(--lime);display:inline-block;animation:loadPulse 1.1s ease-in-out infinite;}
.load-dots span:nth-child(2){animation-delay:.15s;}
.load-dots span:nth-child(3){animation-delay:.3s;}
@keyframes loadPulse{0%,100%{opacity:.25;transform:scale(.75);}50%{opacity:1;transform:scale(1);}}
</style>
</head>

<div class="page">
  <div class="page-head">
    <div class="brand">
      <span class="brand-badge"><svg class="icon" style="width:20px;height:20px"><use href="#i-lock-closed"></use></svg></span>
      <div><div class="brand-name">SpeedLock</div><div class="brand-sub">Ecrãs em falta — protótipo clicável</div></div>
    </div>
  </div>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-screen="abertura" onclick="selectScreen('abertura')"><svg class="icon"><use href="#i-lock-closed"></use></svg>Abertura</button>
    <button class="tab" data-screen="boasvindas" onclick="selectScreen('boasvindas')"><svg class="icon"><use href="#i-scooter"></use></svg>Boas-vindas</button>
    <button class="tab" data-screen="login" onclick="selectScreen('login')"><svg class="icon"><use href="#i-mail"></use></svg>Login</button>

function gaugeDeg(v){ return (v/maxSpeed)*360; }
function updateGauge(){
  const fill=document.getElementById('gauge-fill');
  if(!fill) return;
  const num=document.getElementById('gauge-num');
  const state=document.getElementById('gauge-state');
  if(locked){
    fill.setAttribute('stroke-dashoffset',String(CIRC));
    fill.setAttribute('stroke','#9C93AC');
    num.textContent='--';
    state.textContent='Bloqueada';
    state.style.color='#FF6B5B';
  } else {
    const frac=currentSpeedVal/maxSpeed;
    fill.setAttribute('stroke-dashoffset',String(CIRC-CIRC*frac));
    fill.setAttribute('stroke','#8B5CF6');
    num.textContent=currentSpeedVal;
    state.textContent='A circular';
    state.style.color='#8B5CF6';
  }
}
function initGauge(){
  updateGauge();
  const marker=document.getElementById('gauge-marker');
  if(marker) marker.setAttribute('transform','rotate('+gaugeDeg(speedLimit)+' 105 105)');
  const slider=document.getElementById('limit-slider');
  if(slider) slider.value=speedLimit;
  const lv=document.getElementById('limit-value');
  if(lv) lv.textContent=speedLimit+' km/h';
  document.querySelectorAll('.mode-btn').forEach(function(b){ b.classList.toggle('active', b.dataset.mode===activeMode); });
  const lockBtn=document.getElementById('lock-btn');
  if(lockBtn){ lockBtn.classList.toggle('on',locked); const ai=lockBtn.querySelector('.a-icon'); if(ai) ai.innerHTML=icon(locked?'i-lock-closed':'i-lock-open',19); }
  const lightsBtn=document.getElementById('lights-btn');
  if(lightsBtn) lightsBtn.classList.toggle('on',lightsOn);
}
function toggleLock(){
  locked=!locked;
  updateGauge();
  const lockBtn=document.getElementById('lock-btn');
  lockBtn.classList.toggle('on',locked);
  lockBtn.querySelector('.a-icon').innerHTML=icon(locked?'i-lock-closed':'i-lock-open',19);
}
function toggleLights(){
  lightsOn=!lightsOn;
  document.getElementById('lights-btn').classList.toggle('on',lightsOn);
}
function hornPress(el){
  el.classList.add('pulse');
  setTimeout(function(){ el.classList.remove('pulse'); },400);
}
function onLimitInput(val){
  speedLimit=parseInt(val,10);
  document.getElementById('limit-value').textContent=speedLimit+' km/h';
  document.getElementById('gauge-marker').setAttribute('transform','rotate('+gaugeDeg(speedLimit)+' 105 105)');
  document.querySelectorAll('.mode-btn').forEach(function(b){ b.classList.remove('active'); });
}
function setMode(mode){
  activeMode=mode;
  const map={eco:15,normal:20,sport:25};
  speedLimit=map[mode];
  document.getElementById('limit-slider').value=speedLimit;
  document.getElementById('limit-value').textContent=speedLimit+' km/h';
  document.getElementById('gauge-marker').setAttribute('transform','rotate('+gaugeDeg(speedLimit)+' 105 105)');
  document.querySelectorAll('.mode-btn').forEach(function(b){ b.classList.toggle('active', b.dataset.mode===mode); });
}
function togglePw(id,btn){
  const inp=document.getElementById(id);
  const showing=inp.type==='text';
  inp.type=showing?'password':'text';
  btn.innerHTML=icon(showing?'i-eye':'i-eye-off',18);
}
function goToStep(n){ recoverStep=n; renderScreen(); }
function onCodeInput(el,idx){
  if(el.value.length>1) el.value=el.value.slice(-1);
  if(el.value && idx<6){ const nxt=document.getElementById('code'+(idx+1)); if(nxt) nxt.focus(); }
}
function onCodeKeydown(e,idx){
  if(e.key==='Backspace' && !e.target.value && idx>1){ const prv=document.getElementById('code'+(idx-1)); if(prv) prv.focus(); }
}

function afterRender(){ if(currentScreen==='controlo'){ initGauge(); } }
function renderScreen(){
  document.getElementById('screen-content').innerHTML=screens[currentScreen]();
  const lbl=document.getElementById('stage-label');
  if(lbl) lbl.textContent=screenLabels[currentScreen];
  afterRender();
}
function selectScreen(id){
  currentScreen=id;
  if(id==='recuperar') recoverStep=1;
  document.querySelectorAll('.tab').forEach(function(b){ b.classList.toggle('active', b.dataset.screen===id); });
  renderScreen();
}
renderScreen();
