<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpeedLock — Utilizadores</title>
<meta name="robots" content="noindex">
<style>
  :root{
    --bg:#0B0710; --surface:#17111F; --surface-2:#201A2B;
    --line:rgba(255,255,255,.09); --accent:#8B5CF6;
    --text-1:#F4F2F7; --text-2:#9C93AC; --text-3:#6B6279;
    --warn:#F5A623; --error:#FF6B5B; --lime:#22C55E;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text-1);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-size:14px;
  }
  header{
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
    padding:16px 20px; border-bottom:1px solid var(--line);
    position:sticky; top:0; background:rgba(11,7,16,.95); backdrop-filter:blur(8px);
    z-index:10;
  }
  header h1{font-size:15px; font-weight:700; margin:0;}
  .nav-links{display:flex; gap:4px;}
  .nav-links a{color:var(--text-2); text-decoration:none; padding:6px 10px; border-radius:7px; font-size:12.5px;}
  .nav-links a.active{background:var(--surface-2); color:var(--text-1);}
  header .spacer{flex:1;}

  #search{
    flex:1; max-width:360px;
    background:var(--surface-2); color:var(--text-1); border:1px solid var(--line);
    border-radius:9px; padding:9px 14px; font-size:13.5px;
  }
  #search:focus{outline:none; border-color:var(--accent);}

  main{display:grid; grid-template-columns:380px 1fr; min-height:calc(100vh - 65px);}
  #list{border-right:1px solid var(--line); overflow-y:auto;}
  .user-row{
    padding:14px 18px; border-bottom:1px solid var(--line); cursor:pointer;
    display:flex; flex-direction:column; gap:3px;
  }
  .user-row:hover{background:var(--surface);}
  .user-row.selected{background:var(--surface-2); border-left:3px solid var(--accent); padding-left:15px;}
  .user-row .email{font-weight:600; font-size:13.5px;}
  .user-row .name{color:var(--text-2); font-size:12.5px;}
  .user-row .meta{color:var(--text-3); font-size:11px; margin-top:2px;}
  .badge{display:inline-block; font-size:10px; font-weight:700; padding:2px 7px; border-radius:999px; margin-left:6px;}
  .badge.flagged{background:rgba(255,107,91,.18); color:var(--error);}
  .badge.disabled{background:rgba(255,255,255,.1); color:var(--text-2);}

  #detail{padding:28px 32px; overflow-y:auto;}
  #detail .placeholder{color:var(--text-3); text-align:center; margin-top:80px;}
  .detail-head{display:flex; align-items:center; gap:16px; margin-bottom:24px;}
  .avatar{
    width:56px; height:56px; border-radius:50%;
    background:linear-gradient(135deg,#A855F7,#6D28D9);
    display:flex; align-items:center; justify-content:center;
    font-weight:700; font-size:20px; flex-shrink:0;
  }
  .detail-head h2{margin:0; font-size:18px;}
  .detail-head .sub{color:var(--text-2); font-size:13px; margin-top:2px;}
  .section{margin-bottom:28px;}
  .section h3{font-size:12.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-3); margin:0 0 12px;}
  .info-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:14px;}
  .info-item{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px 14px;}
  .info-item .l{color:var(--text-3); font-size:11px;}
  .info-item .v{font-size:13.5px; font-weight:600; margin-top:3px;}

  .device-card{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center;}
  .device-card .t{font-weight:600; font-size:13px;}
  .device-card .s{color:var(--text-3); font-size:11.5px;}
  .pill{font-size:10px; font-weight:700; padding:3px 8px; border-radius:999px; background:var(--surface-2); color:var(--text-2);}
  .pill.owner{background:rgba(139,92,246,.18); color:var(--accent);}
  .pill.stolen{background:rgba(255,107,91,.18); color:var(--error);}

  .activity-row{display:grid; grid-template-columns:130px 1fr; gap:12px; padding:8px 0; border-bottom:1px solid var(--line); font-size:12.5px;}
  .activity-row .when{color:var(--text-3);}
  .activity-row .what strong{color:var(--text-1);}
  .activity-row .what span{color:var(--text-2);}

  #status{color:var(--text-3); font-size:11.5px;}
</style>
</head>
<body>

<header>
  <h1>🔒 SpeedLock</h1>
  <nav class="nav-links">
    <a href="/admin">Logs</a>
    <a href="/admin/users.html" class="active">Utilizadores</a>
  </nav>
  <input id="search" type="text" placeholder="Pesquisar por email ou nome…">
  <div class="spacer"></div>
  <span id="status"></span>
</header>

<main>
  <div id="list"></div>
  <div id="detail"><div class="placeholder">Seleciona um utilizador à esquerda.</div></div>
</main>

<script>
  const listEl = document.getElementById('list');
  const detailEl = document.getElementById('detail');
  const searchEl = document.getElementById('search');
  const statusEl = document.getElementById('status');

  let debounceTimer = null;
  let selectedUid = null;

  function fmtDate(iso) {
    if (!iso) return '—';
    return new Date(iso).toLocaleString('pt-PT');
  }

  function initials(name, email) {
    const base = (name || email || '?').trim();
    return base.slice(0, 1).toUpperCase();
  }

  function renderUserRow(u) {
    const row = document.createElement('div');
    row.className = 'user-row' + (u.uid === selectedUid ? ' selected' : '');
    row.innerHTML = `
      <div class="email">${u.email || '(sem email)'}${u.disabled ? '<span class="badge disabled">desativado</span>' : ''}</div>
      <div class="name">${u.name || 'Sem nome definido'}</div>
      <div class="meta">Criada em ${fmtDate(u.createdAt)}</div>
    `;
    row.addEventListener('click', () => selectUser(u.uid));
    return row;
  }

  async function loadUsers() {
    const search = searchEl.value.trim();
    statusEl.textContent = 'a procurar…';
    const params = new URLSearchParams();
    if (search) params.set('search', search);

    try {
      const res = await fetch('/admin/api/users?' + params.toString());
      const data = await res.json();
      listEl.innerHTML = '';
      if (data.users.length === 0) {
        listEl.innerHTML = '<div class="placeholder" style="padding:24px;color:var(--text-3);">Sem resultados.</div>';
      } else {
        data.users.forEach((u) => listEl.appendChild(renderUserRow(u)));
      }
      statusEl.textContent = data.users.length + ' utilizador(es)' + (data.truncated ? ' · pesquisa parcial (muitas contas)' : '');
    } catch (err) {
      statusEl.textContent = 'erro: ' + err.message;
    }
  }

  async function selectUser(uid) {
    selectedUid = uid;
    document.querySelectorAll('.user-row').forEach((el, i) => el.classList.remove('selected'));
    loadUsers(); // reaplica a seleção visual na lista

    detailEl.innerHTML = '<div class="placeholder">a carregar…</div>';
    try {
      const res = await fetch('/admin/api/users/' + encodeURIComponent(uid));
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const u = await res.json();
      renderDetail(u);
    } catch (err) {
      detailEl.innerHTML = '<div class="placeholder">Erro a carregar: ' + err.message + '</div>';
    }
  }

  function renderDetail(u) {
    const devicesHtml = u.devices.length
      ? u.devices.map((d) => `
        <div class="device-card">
          <div>
            <div class="t">${d.name || d.brand || d.deviceId}</div>
            <div class="s">${d.deviceId}</div>
          </div>
          <div>
            ${d.isOwner ? '<span class="pill owner">Dono</span>' : `<span class="pill">${d.level}</span>`}
            ${d.stolen ? '<span class="pill stolen">Roubada</span>' : ''}
          </div>
        </div>
      `).join('')
      : '<div class="placeholder" style="margin:0;text-align:left;">Sem dispositivos.</div>';

    const activityHtml = u.recentActivity.length
      ? u.recentActivity.map((a) => `
        <div class="activity-row">
          <div class="when">${fmtDate(a.timestamp ? new Date(a.timestamp).toISOString() : null)}</div>
          <div class="what"><strong>${a.actorName || 'Utilizador'}</strong> <span>— ${a.action} · ${a.deviceId}</span></div>
        </div>
      `).join('')
      : '<div class="placeholder" style="margin:0;text-align:left;">Sem atividade registada.</div>';

    detailEl.innerHTML = `
      <div class="detail-head">
        <div class="avatar">${initials(u.name, u.email)}</div>
        <div>
          <h2>${u.name || 'Sem nome definido'} ${u.flagged ? '<span class="badge flagged">sinalizada</span>' : ''}</h2>
          <div class="sub">${u.email || '(sem email)'}</div>
        </div>
      </div>

      <div class="section">
        <h3>Detalhes</h3>
        <div class="info-grid">
          <div class="info-item"><div class="l">Conta criada</div><div class="v">${fmtDate(u.createdAt)}</div></div>
          <div class="info-item"><div class="l">Último login</div><div class="v">${fmtDate(u.lastSignInAt)}</div></div>
          <div class="info-item"><div class="l">UID</div><div class="v" style="font-size:11px;font-family:monospace;">${u.uid}</div></div>
        </div>
      </div>

      <div class="section">
        <h3>Dispositivos (${u.devices.length})</h3>
        ${devicesHtml}
      </div>

      <div class="section">
        <h3>Atividade recente</h3>
        ${activityHtml}
      </div>
    `;
  }

  searchEl.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(loadUsers, 350);
  });

  loadUsers();
</script>

</body>
</html>
