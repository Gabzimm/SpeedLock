<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SpeedLock — Logs</title>
<meta name="robots" content="noindex">
<style>
  :root{
    --bg:#0B0710; --surface:#17111F; --surface-2:#201A2B;
    --line:rgba(255,255,255,.09); --accent:#8B5CF6;
    --text-1:#F4F2F7; --text-2:#9C93AC; --text-3:#6B6279;
    --warn:#F5A623; --error:#FF6B5B; --debug:#6B7280;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text-1);
    font-family:'SF Mono',Consolas,Menlo,monospace;
    font-size:13px;
  }
  header{
    display:flex; align-items:center; gap:16px; flex-wrap:wrap;
    padding:16px 20px; border-bottom:1px solid var(--line);
    position:sticky; top:0; background:rgba(11,7,16,.95); backdrop-filter:blur(8px);
    z-index:10;
  }
  header h1{font-size:15px; font-weight:700; margin:0; font-family:sans-serif;}
  header .spacer{flex:1;}
  select, button{
    background:var(--surface-2); color:var(--text-1); border:1px solid var(--line);
    border-radius:8px; padding:7px 10px; font-family:sans-serif; font-size:12.5px; cursor:pointer;
  }
  button.active{background:var(--accent); border-color:var(--accent); color:#fff;}
  #status{color:var(--text-3); font-size:11.5px; font-family:sans-serif;}
  main{padding:12px 20px 60px;}
  .row{
    display:grid; grid-template-columns:150px 56px 90px 1fr; gap:12px;
    padding:6px 10px; border-radius:6px; align-items:baseline;
  }
  .row:hover{background:var(--surface);}
  .row .time{color:var(--text-3);}
  .row .lvl{font-weight:700; font-size:11px; text-transform:uppercase;}
  .lvl-30{color:var(--accent);}
  .lvl-40{color:var(--warn);}
  .lvl-50{color:var(--error);}
  .lvl-20{color:var(--debug);}
  .row .path{color:var(--text-2);}
  .row .msg{color:var(--text-1); word-break:break-word;}
  .row .meta{color:var(--text-3); font-size:11.5px; margin-left:8px;}
  #empty{color:var(--text-3); font-family:sans-serif; padding:40px; text-align:center;}  header .nav-links{display:flex; gap:4px; font-family:sans-serif;}
  header .nav-links a{
    color:var(--text-2); text-decoration:none; padding:6px 10px; border-radius:7px; font-size:12.5px;
  }
  header .nav-links a.active{background:var(--surface-2); color:var(--text-1);}
</style>
</head>
<body>

<header>
  <h1>🔒 SpeedLock</h1>
  <nav class="nav-links">
    <a href="/admin" class="active">Logs</a>
    <a href="/admin/users.html">Utilizadores</a>
  </nav>
  <select id="date"></select>
  <select id="level">
    <option value="">Todos os níveis</option>
    <option value="debug">Debug e acima</option>
    <option value="info">Info e acima</option>
    <option value="warn">Warn e acima</option>
    <option value="error">Só erros</option>
  </select>
  <button id="pauseBtn">⏸ Pausar</button>
  <div class="spacer"></div>
  <span id="status">a carregar…</span>
</header>

<main>
  <div id="logs"></div>
  <div id="empty" style="display:none;">Sem entradas para este dia/filtro.</div>
</main>

<script>
  const dateSel = document.getElementById('date');
  const levelSel = document.getElementById('level');
  const pauseBtn = document.getElementById('pauseBtn');
  const logsEl = document.getElementById('logs');
  const emptyEl = document.getElementById('empty');
  const statusEl = document.getElementById('status');

  let paused = false;
  let timer = null;

  function levelLabel(n) {
    return { 20: 'debug', 30: 'info', 40: 'warn', 50: 'error' }[n] || n;
  }

  function renderEntry(e) {
    const time = e.time ? new Date(e.time).toLocaleTimeString('pt-PT') : '';
    const lvl = levelLabel(e.level);
    const path = e.path || e.msg || '';
    const bits = [];
    if (e.method) bits.push(e.method);
    if (e.status) bits.push('HTTP ' + e.status);
    if (e.durationMs !== undefined) bits.push(e.durationMs + 'ms');
    if (e.uid) bits.push('uid:' + e.uid);
    if (e.code) bits.push(e.code);
    const meta = bits.join(' · ');
    const msg = e.msg || '';

    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `
      <span class="time">${time}</span>
      <span class="lvl lvl-${e.level}">${lvl}</span>
      <span class="path">${e.path ? e.path.replace(/[<>&]/g, '') : ''}</span>
      <span><span class="msg">${msg.replace(/[<>&]/g, '')}</span><span class="meta">${meta.replace(/[<>&]/g, '')}</span></span>
    `;
    return row;
  }

  async function loadDates() {
    const res = await fetch('/admin/api/logs?limit=1');
    const data = await res.json();
    dateSel.innerHTML = '';
    const dates = data.availableDates.length ? data.availableDates : [data.date];
    dates.forEach((d) => {
      const opt = document.createElement('option');
      opt.value = d;
      opt.textContent = d;
      dateSel.appendChild(opt);
    });
  }

  async function loadLogs() {
    if (paused) return;
    const date = dateSel.value;
    const level = levelSel.value;
    const params = new URLSearchParams({ date, limit: 300 });
    if (level) params.set('level', level);

    try {
      const res = await fetch('/admin/api/logs?' + params.toString());
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();

      logsEl.innerHTML = '';
      if (data.entries.length === 0) {
        emptyEl.style.display = 'block';
      } else {
        emptyEl.style.display = 'none';
        // Mais recente primeiro.
        data.entries.slice().reverse().forEach((e) => logsEl.appendChild(renderEntry(e)));
      }
      statusEl.textContent = data.entries.length + ' entradas · atualizado ' + new Date().toLocaleTimeString('pt-PT');
    } catch (err) {
      statusEl.textContent = 'erro a carregar: ' + err.message;
    }
  }

  pauseBtn.addEventListener('click', () => {
    paused = !paused;
    pauseBtn.textContent = paused ? '▶ Continuar' : '⏸ Pausar';
    pauseBtn.classList.toggle('active', paused);
  });
  dateSel.addEventListener('change', loadLogs);
  levelSel.addEventListener('change', loadLogs);

  (async function init() {
    await loadDates();
    await loadLogs();
    timer = setInterval(loadLogs, 5000);
  })();
</script>

</body>
</html>
