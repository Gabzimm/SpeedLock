name: speedlock
description: App de controlo e segurança para trotinetes elétricas.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Estado
  flutter_riverpod: ^2.5.1

  # Navegação
  go_router: ^14.2.0

  # Firebase (Auth + Firestore + Storage — o "compute" mudou para o
  # backend próprio, ver server/)
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.1
  firebase_storage: ^12.0.1

  # HTTP — fala com o backend próprio (server/) que substitui as antigas
  # Cloud Functions
  http: ^1.2.2

  # Perfil (foto)
  image_picker: ^1.1.2

  # Segurança / armazenamento local
  flutter_secure_storage: ^9.2.2

  # Bluetooth
  flutter_reactive_ble: ^5.3.1
  permission_handler: ^11.3.1
  usb_serial: ^0.5.1

  # Tipografia (Space Grotesk + Manrope, sem empacotar .ttf à mão)
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png

# Gera o ícone da app (Android e iOS) a partir do logótipo real —
# correr com `dart run flutter_launcher_icons` depois do `flutter pub get`.
# `adaptive_icon_background` usa o roxo escuro da marca, para o "SPEED"
# (que é quase preto) não se perder num ecrã principal claro.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#0B0710"
  adaptive_icon_foreground: "assets/logo.png"
