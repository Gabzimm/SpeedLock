workflows:
  android-apk:
    name: SpeedLock - APK de teste
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Gerar pastas nativas (android/ios)
        script: flutter create . --project-name speedlock --org com.speedlock

      - name: Forcar Android SDK 36 em TODOS os modulos (app + plugins)
        script: |
          set -e
          # O erro real era ":reactive_ble_mobile is currently compiled
          # against android-33" — quem esta desatualizado e o modulo do
          # PLUGIN de Bluetooth, nao a app. Mudar so o compileSdk da app
          # (tentativa anterior) nao tinha efeito nenhum sobre os plugins,
          # por isso o erro repetia-se igual.
          #
          # Isto acrescenta ao build.gradle da RAIZ um bloco que corre
          # depois de cada sub-modulo ser configurado e forca o compileSdk
          # de todos eles. Usa reflexao para nao precisar de importar
          # classes do Android Gradle Plugin no ficheiro da raiz.
          if [ -f android/build.gradle.kts ]; then
            echo "--- detetado build.gradle.kts (Kotlin DSL) ---"
            F=android/build.gradle.kts
            echo '' >> $F
            echo '// Forca compileSdk 36 em todos os sub-modulos (plugins incluidos).' >> $F
            echo 'subprojects {' >> $F
            echo '    afterEvaluate {' >> $F
            echo '        if (project.hasProperty("android")) {' >> $F
            echo '            val androidExt = project.property("android")' >> $F
            echo '            try {' >> $F
            echo '                val m = androidExt.javaClass.getMethod("compileSdkVersion", Int::class.javaPrimitiveType)' >> $F
            echo '                m.invoke(androidExt, 36)' >> $F
            echo '                println("compileSdk forcado para 36 em " + project.name)' >> $F
            echo '            } catch (e: Exception) {' >> $F
            echo '                println("falhou forcar compileSdk em " + project.name + ": " + e.message)' >> $F
            echo '            }' >> $F
            echo '        }' >> $F
            echo '    }' >> $F
            echo '}' >> $F
          elif [ -f android/build.gradle ]; then
            echo "--- detetado build.gradle (Groovy) ---"
            F=android/build.gradle
            echo '' >> $F
            echo '// Forca compileSdk 36 em todos os sub-modulos (plugins incluidos).' >> $F
            echo 'subprojects {' >> $F
            echo '    afterEvaluate { proj ->' >> $F
            echo '        if (proj.hasProperty("android")) {' >> $F
            echo '            proj.android.compileSdkVersion 36' >> $F
            echo '            println "compileSdk forcado para 36 em " + proj.name' >> $F
            echo '        }' >> $F
            echo '    }' >> $F
            echo '}' >> $F
          else
            echo "ERRO: nao encontrei android/build.gradle nem android/build.gradle.kts"
            ls -la android/
            exit 1
          fi
          echo "--- ficheiro da raiz final ---"
          cat $F

      - name: Instalar dependencias
        script: flutter pub get

      - name: Gerar icone da app a partir do logotipo real
        script: dart run flutter_launcher_icons

      - name: Compilar APK (release)
        script: flutter build apk --release

    artifacts:
      - build/app/outputs/flutter-apk/*.apk
