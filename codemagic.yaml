workflows:
  android-apk:
    name: SpeedLock - APK de teste
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Gerar pastas nativas (android/ios)
        script: flutter create . --project-name speedlock --org com.speedlock
      - name: Subir versão do Android SDK (33 é baixa demais para o Bluetooth)
        script: |
          echo "--- ficheiro antes ---"
          cat android/app/build.gradle.kts 2>/dev/null || cat android/app/build.gradle 2>/dev/null
          # Troca a linha inteira de compileSdk/targetSdk por "= 36", seja
          # qual for o texto exato que lá estiver (mais robusto do que
          # tentar adivinhar a expressão certa à primeira).
          sed -E -i '' 's/^([[:space:]]*)compileSdk(Version)?[[:space:]]*=?.*$/\1compileSdk = 36/' android/app/build.gradle.kts 2>/dev/null || true
          sed -E -i '' 's/^([[:space:]]*)targetSdk(Version)?[[:space:]]*=?.*$/\1targetSdk = 36/' android/app/build.gradle.kts 2>/dev/null || true
          sed -E -i '' 's/^([[:space:]]*)compileSdk(Version)?[[:space:]]+.*$/\1compileSdk 36/' android/app/build.gradle 2>/dev/null || true
          sed -E -i '' 's/^([[:space:]]*)targetSdk(Version)?[[:space:]]+.*$/\1targetSdk 36/' android/app/build.gradle 2>/dev/null || true
          echo "--- ficheiro depois ---"
          cat android/app/build.gradle.kts 2>/dev/null || cat android/app/build.gradle 2>/dev/null
      - name: Instalar dependências
        script: flutter pub get
      - name: Gerar ícone da app a partir do logótipo real
        script: dart run flutter_launcher_icons
      - name: Compilar APK (release)
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
