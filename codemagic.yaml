workflows:
  android-apk:
    name: SpeedLock - APK de teste
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Gerar pastas nativas (android/ios)
        script: flutter create . --project-name speedlock --org com.speedlock
      - name: Instalar dependências
        script: flutter pub get
      - name: Gerar ícone da app a partir do logótipo real
        script: dart run flutter_launcher_icons
      - name: Compilar APK (release)
        script: flutter build apk --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
